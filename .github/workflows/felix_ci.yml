# felix_jr's CI (this fork's; upstream's workflows are disabled here). Public repository: GitHub-hosted Linux runners
# at no cost. `tests` and `guard` are the checks `main`'s ruleset requires; `smoke` runs nightly and on demand.
name: felix_jr

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "17 7 * * *" # the smoke tests, nightly (07:17 UTC)

env:
  UV_VERSION: "0.11.30"
  PYTHON_VERSION: "3.12"
  MUJOCO_GL: osmesa # the simulator's renders, no GPU
  PYOPENGL_PLATFORM: osmesa
  FELIX_JR_SIM_CACHE: /home/runner/.cache/felix_jr/so101

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  # no session images, captures or scratch files in a change (docs/layout.md: recorded data stays in scratch); the
  # Python it changes formatted and linted (the older files' lint debt is not this check's)
  guard:
    name: guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          lfs: false
      - name: No images, captures or scratch files added
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          added=$(git diff --name-only --diff-filter=A "$BASE"...HEAD)
          bad=$(printf '%s\n' "$added" | grep -iE '(^|/)scratch/|\.(png|jpe?g|bmp|tiff?|gif|webp|heic|mp4|avi|mov|mkv|pkl|pickle|bag|ply|pcd)$' || true)
          if [ -n "$bad" ]; then
            echo "These look like recorded data (scratch/, images, video, pickles, point clouds); keep them out of git:"
            echo "$bad"
            exit 1
          fi
      - name: Setup uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false # (nothing to cache: ruff runs through uvx)
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Ruff on the changed Python files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only --diff-filter=AM "$BASE"...HEAD -- '*.py' | grep -E '^(src/lerobot/felix_jr|tests/felix_jr)/' || true)
          if [ -z "$files" ]; then echo "no felix_jr Python changed"; exit 0; fi
          ruff_version=$(grep -A2 '^name = "ruff"' uv.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          uvx "ruff@${ruff_version}" format --check $files
          uvx "ruff@${ruff_version}" check $files

  tests:
    name: tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
      - name: felix_jr's LFS files only (the finger's mesh)
        run: git lfs pull --include "src/lerobot/felix_jr/**,tests/felix_jr/**"
      - name: Install apt dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libosmesa6-dev libgl1 libglib2.0-0 ffmpeg libusb-1.0-0-dev
      - name: Setup uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: uv sync --locked --extra test --extra felix_jr_sim --extra pyzmq-dep --extra feetech
      - name: The SO-101 model, cached by its pinned commit
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.FELIX_JR_SIM_CACHE }}
          key: so101-${{ hashFiles('src/lerobot/felix_jr/sim2real/assets.py') }}
      - name: Download the SO-101 model if not cached
        run: uv run python -c "from lerobot.felix_jr.sim2real.assets import so101_model; so101_model()"
      - name: Fast tests
        run: uv run pytest tests/felix_jr -q -m "not smoke and not slow" -p no:cacheprovider

  smoke:
    name: smoke
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
      - name: felix_jr's LFS files only (the finger's mesh)
        run: git lfs pull --include "src/lerobot/felix_jr/**,tests/felix_jr/**"
      - name: Install apt dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libosmesa6-dev libgl1 libglib2.0-0 ffmpeg libusb-1.0-0-dev
      - name: Setup uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: uv sync --locked --extra test --extra felix_jr_sim --extra pyzmq-dep --extra feetech
      - name: The SO-101 model, cached by its pinned commit
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.FELIX_JR_SIM_CACHE }}
          key: so101-${{ hashFiles('src/lerobot/felix_jr/sim2real/assets.py') }}
      - name: Download the SO-101 model if not cached
        run: uv run python -c "from lerobot.felix_jr.sim2real.assets import so101_model; so101_model()"
      - name: All felix_jr tests (smoke and slow too)
        run: uv run pytest tests/felix_jr -q -p no:cacheprovider
